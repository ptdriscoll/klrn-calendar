<html lang="en">
  <head>
    <script class="app-bootloader">
      (function() {
        const pendingUpdate = sessionStorage.getItem('pending-html-update');

        if (!pendingUpdate) {
          return;
        }

        sessionStorage.removeItem('pending-html-update');
        document.documentElement.innerHTML = pendingUpdate;
        
        document.querySelectorAll('script').forEach((oldScript) => {
          const newScript = document.createElement('script');

          Array.from(oldScript.attributes).forEach((attr) => {
            newScript.setAttribute(attr.name, attr.value);
          });

          newScript.textContent = oldScript.textContent;
          oldScript.replaceWith(newScript);
        });

        window.stop();
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="app-version" content="1.0.0">
    <title>KLRN Prime Time Schedule</title>  
    <style>
      :root {
        --pbs-blue: #2638c4;
        --pbs-navy-blue: #0a145a;
        --pbs-medium-blue: #0f1e8c;
        --pbs-light-blue: #486cd8;
        --pbs-white: #ffffff;
        --pbs-teal: #48d3cd;
        --pbs-yellow: #ffcf00;
        --pbs-coral: #fe704e;
        --lighter-blue: #eef2ff;
        --light-gray: #f4f5f7;
        --lighter-gray: #fcfcfc;
        --dark-teal: #349b96;
      }
      
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      #toolbar {
        text-align: center;
        padding: 15px;
        background: var(--lighter-gray);
        border-bottom: 1px solid var(--dark-teal);
      }

      #toolbar button {
        font-size: 10pt;
        margin: 0 5px;
        padding: 5px 12px;
        background: var(--pbs-teal);
        color: var(--pbs-white);
        border: 1px solid var(--dark-teal);
        border-radius: 4px;
        cursor: pointer;
        font-size: 10pt;
      }

      #toolbar button:hover {
        background: var(--pbs-light-blue);
      }

      .calendar {
        page: letter;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-template-rows:
          40px
          25px
          repeat(5, minmax(0, 1fr));
        width: calc(11in - 0.5in);
        height: calc(8.5in - 0.5in - 0.1in);
        margin: 0 auto;
        border-top: 1px solid var(--pbs-navy-blue);
        border-left: 1px solid var(--pbs-navy-blue);
      }
      
      body.legal .calendar {
        page: legal;
        width: calc(14in - 0.5in);
      }      

      .calendar:has(#calendar-days:empty) {
        border: 1px solid black;
      }

      .calendar:has(#calendar-days:empty) > div.month,
      .calendar:has(#calendar-days:empty) > div:nth-child(8) {
        border-right: none;
      }

      #calendar-days {
        display: contents;
      }

      .month {
        position: relative;
        grid-column: 1 / 8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18pt;
        font-weight: bold;
        background: var(--pbs-blue);
        color: var(--pbs-white);
        border-right: 1px solid var(--pbs-navy-blue);
        border-bottom: 4px solid var(--pbs-teal);
        outline: none;
      }

      .month img {
        height: 18pt;
        position: absolute;
        left: 1rem;
      }

      .day-header {
        background: var(--lighter-blue);
        color: var(--pbs-navy-blue);
        border-top: 1px solid var(--pbs-navy-blue);
        border-right: 1px solid var(--pbs-navy-blue);
        border-bottom: 1px solid var(--pbs-navy-blue);
        text-align: center;
        font-size: 9pt;
        font-weight: bold;
        padding-top: 4px;
      }

      .day-header:last-child {
        border-right: none;
      }

      .day {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--pbs-navy-blue);
        border-bottom: 1px solid var(--pbs-navy-blue);
        padding: 7px;
        overflow: hidden;
        font-size: 7pt;
      }

      .split-day {
        display: flex;
        flex-direction: column;
        padding: 0;
      }

      .half-day {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 5px;
        min-height: 0;
      }

      .half-divider {
        border-top: 1px solid var(--pbs-light-blue);
      }

      .day-number {
        flex: 0 0 auto;
        text-align: center;
        font-weight: bold;
        color: var(--pbs-medium-blue);
      }

      .day.near-full,
      .half-day.day.near-full {
        background: rgb(from var(--pbs-yellow) r g b / 18%);
      }

      .day.overflow,
      .half-day.overflow {
        background: rgb(from var(--pbs-coral) r g b / 15%);
      }

      .content {
        flex: 1 1 auto;
        box-sizing: border-box;
        min-height: 0;
        overflow-y: hidden;
        white-space: pre-wrap;
        outline: none;
        line-height: 1.4;
      }

      .content,
      .content div:not(:first-child) {
        margin: 0.5em 0 0;
      }

      .half-day .content,
      .half-day .content div:not(:first-child) {
        margin: 0.3em 0 0;
      }

      .content.shows div {
        padding-left: 1.75em;
        text-indent: -1.75em;
      }

      .time {
        display: inline-block;
        text-indent: 0;
        font-weight: bold;
        color: var(--pbs-blue);
      }
      
      dialog {
        min-width: 320px;
        max-width: 450px;
        padding: 24px;
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      }

      dialog::backdrop {
        background: rgba(0, 0, 0, 0.4);
      }

      #dialog-title {
        margin: 0 0 12px;
        font-size: 16pt;
        color: var(--pbs-navy-blue);
      }

      #dialog-message {
        margin-bottom: 20px;
        white-space: pre-wrap;
        line-height: 1.4;
      }

      #dialog-input {
        width: 100%;
        padding: 8px;
        margin-bottom: 20px;
        font-size: 11pt;
        box-sizing: border-box;
      }

      #dialog-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      #dialog-buttons button {
        min-width: 70px;
        padding: 6px 14px;
        border: 1px solid var(--dark-teal);
        border-radius: 4px;
        background: var(--pbs-teal);
        color: var(--pbs-white);
        cursor: pointer;
      }

      #dialog-buttons button:hover {
        background: var(--pbs-light-blue);
      }

      #dialog-spinner {
        width: 32px;
        height: 32px;
        margin: 0 auto 16px;
        border: 4px solid var(--lighter-blue);
        border-top-color: var(--pbs-blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      #dialog:has(#dialog-spinner:not([hidden])) {
        text-align: center;
      }
      
      #toolbar button:active,
      #dialog-buttons button:active {
        transform: translateY(1px);
      }

      #toolbar button:disabled,
      #dialog-buttons button:disabled {
        opacity: 0.6;
        cursor: wait;
      }      

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }      
      
      @media print {
        * {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        #toolbar {
          display: none;
        }
      }
      
      @page letter {
        size: letter landscape;
        margin: 0.25in;
      }

      @page legal {
        size: legal landscape;
        margin: 0.25in;
      }      
    </style>   
  </head>

        Prime Time Schedule -&nbsp;
        <span contenteditable="true">January 2026</span>
      </div>
      <div class="day-header">Sunday</div>
      <div class="day-header">Monday</div>
      <div class="day-header">Tuesday</div>
      <div class="day-header">Wednesday</div>
      <div class="day-header">Thursday</div>
      <div class="day-header">Friday</div>
      <div class="day-header">Saturday</div>
      <div id="calendar-days"></div>

    <dialog id="dialog">
      <h2 id="dialog-title"></h2>
      <div id="dialog-spinner" hidden></div>
      <div id="dialog-message"></div>      
      <input id="dialog-input" hidden>
      <div id="dialog-buttons">
        <button id="dialog-ok">OK</button>
        <button id="dialog-cancel">Cancel</button>
      </div>
    </dialog>

    <script>
      // ======================================================
      // Configuration
      // ======================================================
      const APP = {
        templateUrl: 'http://localhost/dev/klrn-calendar/template.php',
        fileHandle: null,        
        busyTimer: null,
        
        shouldStartNewCalendar() {
          const value = sessionStorage.getItem('pending-new-calendar');
          sessionStorage.removeItem('pending-new-calendar');
          return value === 'true';
        },        
                
        async promptForNewCalendar() {
          const current = new Date();

          let month = await DIALOG.prompt(
            'New Calendar',
            'Month (1-12):',
            current.getMonth() + 1
          );

          if (month === null) {
            return;
          }

          let year = await DIALOG.prompt(
            'New Calendar',
            'Year:',
            current.getFullYear()
          );

          if (year === null) {
            return;
          }

          month = parseInt(month, 10);
          year = parseInt(year, 10);

          if (isNaN(month) || month < 1 || month > 12) {
            await DIALOG.alert(
              'Invalid month',
              'Month must be between 1 and 12.'
            );
            return;
          }

          if (isNaN(year) || year < 2026) {
            await DIALOG.alert(
              'Invalid year',
              'Year must be a four-digit number above 2025.'
            );
            return;
          }

          generateCalendar(month - 1, year);
        },
        
        async checkForUpdates() {
          if (!this.templateUrl) {
            return false;
          }
  
          const html = await this.downloadTemplate();

          if (!html) {
            return false;
          }

          const doc = new DOMParser().parseFromString(html, 'text/html');
          const serverVersion = doc.querySelector('meta[name="app-version"]')?.content;
          const currentVersion = document.querySelector('meta[name="app-version"]')?.content;

          if (
            !serverVersion ||
            !currentVersion ||
            this.compareVersions(serverVersion, currentVersion) <= 0
          ) {
            return false;
          }

          return await DIALOG.confirmUpdate(html, serverVersion);
        },        
        
        async downloadTemplate() {
          DIALOG.showBusy('Checking for updates...');
          
          try {
            const response = await fetch(this.templateUrl);
            if (!response.ok) {
              throw new Error(`Server returned ${response.status}`);
            }
            return await response.text();
          }
          catch (e) {
            console.log('Could not check for updates:', e);
            return null;
          }
          finally {
            DIALOG.hideBusy();
          }
        },       
        
        compareVersions(v1, v2) {
          const a = v1.split('.').map(Number);
          const b = v2.split('.').map(Number);
          const length = Math.max(a.length, b.length);

          for (let i = 0; i < length; i++) {
              const x = a[i] ?? 0;
              const y = b[i] ?? 0;

              if (x > y) {
                  return 1;
              }

              if (x < y) {
                  return -1;
              }
          }
          return 0;
        }     
      };
      
      // ======================================================
      // Dialog
      // ======================================================
      
      const DIALOG = {
        dialog: document.getElementById('dialog'),
        title: document.getElementById('dialog-title'),
        message: document.getElementById('dialog-message'),
        input: document.getElementById('dialog-input'),
        ok: document.getElementById('dialog-ok'),
        cancel: document.getElementById('dialog-cancel'),
        spinner: document.getElementById('dialog-spinner'),

        show({
          title = '',
          message = '',
          input = false,
          spinner = false,
          okText = 'OK',
          showOK = true,
          cancelText = 'Cancel',
          showCancel = false,
          defaultValue = '',
          onOK = null,
          onCancel = null
        } = {}) {
          this.title.textContent = title;
          this.message.textContent = message;

          this.spinner.hidden = !spinner;

          this.input.hidden = !input;
          this.input.value = defaultValue;

          this.ok.textContent = okText;
          this.ok.hidden = !showOK;

          this.cancel.textContent = cancelText;
          this.cancel.hidden = !showCancel;

          this.ok.onclick = onOK;
          this.cancel.onclick = onCancel;

          this.dialog.showModal();

          if (input) {
            this.input.focus();
            this.input.select();
          }
        },
        
        confirmUpdate(html, version) {
          return new Promise((resolve) => {
            this.show({
              title: 'Update Available',
              message: `Version ${version} is available. Update now?`,
              okText: 'Update',
              showCancel: true,

              onOK: async () => {
                this.dialog.close();
                sessionStorage.setItem('pending-html-update', html);
                sessionStorage.setItem('pending-new-calendar', 'true');
                window.location.reload();
              },

              onCancel: () => {
                this.dialog.close();
                resolve(false);
              }
            });
          });
        },        

        confirm(title, message) {
          return new Promise((resolve) => {
            this.show({
              title,
              message,
              showCancel: true
            });

            this.ok.onclick = () => {
              this.dialog.close();
              resolve(true);
            };

            this.cancel.onclick = () => {
              this.dialog.close();
              resolve(false);
            };
          });
        },

        alert(title, message) {
          return new Promise((resolve) => {
            this.show({
              title,
              message
            });

            this.ok.onclick = () => {
              this.dialog.close();
              resolve();
            };
          });
        },

        prompt(title, message, defaultValue = '') {
          return new Promise((resolve) => {
            this.show({
              title,
              message,
              input: true,
              showCancel: true,
              defaultValue
            });

            this.ok.onclick = () => {
              const value = this.input.value;
              this.dialog.close();
              resolve(value);
            };

            this.cancel.onclick = () => {
              this.dialog.close();
              resolve(null);
            };

            this.input.onkeydown = (e) => {
              if (e.key === 'Enter') {
                this.ok.click();
              }
            };
          });
        },

        showBusy(message) {
          this.show({
            message,
            spinner: true,
            showOK: false,
            showCancel: false
          });
        },

        hideBusy() {
          this.dialog.close();
        }
      };   
      
      // ======================================================
      // Initialization
      // ======================================================      

      initialize();
      
      function initialize() {
        attachContentListeners();
        formatAllDays();
        checkAllDays();
        if (APP.shouldStartNewCalendar()) {
          APP.promptForNewCalendar();
        }
      }

      function attachContentListeners() {
        document.querySelectorAll('.content').forEach((el) => {
          el.addEventListener('blur', () => {
            formatDay(el);
            checkOverflow(el.closest('.day'));
          });

          el.addEventListener('input', () => {
            checkOverflow(el.closest('.day'));
          });
        });
      }
     
      // ======================================================
      // Calendar
      // ====================================================== 

      async function newCalendar() {
        if (!(await DIALOG.confirm(
          'New Calendar',
          'This will clear the current calendar. Continue?'
        ))) {
          return;
        }

        if (await APP.checkForUpdates()) {
          return;
        }

        await APP.promptForNewCalendar();
      }

      async function saveCalendar() {
        formatAllDays();
        checkAllDays();

        try {
          if (!APP.fileHandle) {
            APP.fileHandle = await window.showSaveFilePicker({
              suggestedName: 'KLRN-Prime-Time-Schedule.html',
              types: [
                {
                  description: 'HTML Files',
                  accept: {
                    'text/html': ['.html']
                  }
                }
              ]
            });
          }
          const writable = await APP.fileHandle.createWritable();
          await writable.write(document.documentElement.outerHTML);
          await writable.close();
        } catch (err) {
          console.error(err);
        }
      }

      function setMonthTitle(month, year) {
        const monthNames = [
          'January',
          'February',
          'March',
          'April',
          'May',
          'June',
          'July',
          'August',
          'September',
          'October',
          'November',
          'December'
        ];

        document.querySelector('.month span').textContent =
          `${monthNames[month]} ${year}`;
      }

      function generateCalendar(month, year) {
        setMonthTitle(month, year);
        const firstWeekday = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cells = new Array(42).fill(null);

        for (let day = 1; day <= daysInMonth; day++) {
          cells[firstWeekday + day - 1] = {
            day,
            overflowDay: null
          };
        }

        // Merge row 6 into row 5
        for (let col = 0; col < 7; col++) {
          const row5 = 28 + col;
          const row6 = 35 + col;

          if (cells[row6]) {
            if (!cells[row5]) {
              cells[row5] = {
                day: null,
                overflowDay: cells[row6].day
              };
            } else {
              cells[row5].overflowDay = cells[row6].day;
            }

            cells[row6] = null;
          }
        }

        // Render five rows
        let html = '';
        for (let i = 0; i < 35; i++) {
          const cell = cells[i];

          if (!cell) {
            html += `<div class="day">
                         <div class="content messages" contenteditable="true"></div>
                     </div>`;
            continue;
          }

          // Split day
          if (cell.overflowDay !== null) {
            html += `<div class="day split-day">
                         <div class="half-day">${
                           cell.day !== null
                             ? `
                             <div class="day-number">${cell.day}</div>
                             <div class="content shows" contenteditable="true"></div>`
                             : ''
                         }
                        </div>
                    <div class="half-divider"></div>
                    <div class="half-day">
                        <div class="day-number">${cell.overflowDay}</div>
                        <div class="content shows" contenteditable="true"></div>
                    </div>
                </div>`;
          }

          // Normal day
          else {
            html += `<div class="day">
                         <div class="day-number">${cell.day}</div>
                         <div class="content shows" contenteditable="true"></div>
                     </div>`;
          }
        }

        document.querySelector('#calendar-days').innerHTML = html;
        attachContentListeners();
        formatAllDays();
        checkAllDays();
      }
      
      // ======================================================
      // Formatting
      // ======================================================      
      
      function formatDay(el) {
        const lines = el.innerText.split('\n').map((line) => line.trim());
        let html = '';

        for (const line of lines) {
          if (!line) {
            continue;
          }

          const match = line.match(
            /^(\d{1,2}(?::\d{2})?)\s*([ap])\s*\.?\s*m\s*\.?\s*(.*)$/i
          );

          if (match) {
            const normalizedTime = `${match[1]} ${match[2].toLowerCase()}.m.`;
            html += `<div class="show-entry">`;
            html += `<span class="time">${normalizedTime}</span> `;
            html += `${match[3]}</div>`;
          } else {
            html += `<div>${line}</div>`;
          }
        }

        el.innerHTML = html;
      }    

      function formatAllDays() {
        document.querySelectorAll('.content').forEach((el) => {
          formatDay(el);
        });
      }

      function checkAllDays() {
        document.querySelectorAll('.day').forEach((day) => {
          checkOverflow(day);
        });
      }

      function checkOverflow(day) {
        const contents = day.querySelectorAll('.content');
        for (const content of contents) {
          const container =
            content.closest('.half-day') || content.closest('.day');
          container.classList.toggle(
            'overflow',
            content.scrollHeight > content.clientHeight
          );
        }
      } 

      function togglePageSize() {
        const button = document.getElementById('page-size-button');
        const legal = document.body.classList.toggle('legal');

        button.textContent = legal
          ? 'Letter Size'
          : 'Legal Size';

        console.log(`Page size: ${legal ? 'Legal' : 'Letter'}`);
      }      
    </script>
